name: Flutter Frontend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-flutter:
    name: Build, Analyze & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Mock .env File
        run: |
          echo "BASE_URL=https://shekharsir-backend.onrender.com" > .env
          echo "APP_NAME=Shekhar Sir Classes" >> .env
          echo "ENVIRONMENT=production" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Source Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test || true

      - name: Build Android APK
        run: flutter build apk --debug
