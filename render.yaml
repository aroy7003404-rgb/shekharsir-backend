services:
  - type: web
    name: shekharsir-fastapi-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && alembic upgrade head && python backend/seed.py
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT backend.main:app
    envVars:
      - key: ENV_MODE
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shekharsir-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: SENTRY_DSN
        value: ""
      - key: ADMIN_NAME
        value: "Shekhar Sir (Admin)"
      - key: ADMIN_EMAIL
        value: "shekhar.sir@shekharsir.edu"
      - key: ADMIN_PASSWORD
        value: "ShekharSir2026!"

databases:
  - name: shekharsir-postgres
    plan: free
    databaseName: shekharsir_db
    user: postgres
